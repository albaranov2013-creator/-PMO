<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Резюме Сергея Амелехина — рабочий портал</title>
  <style>
    :root {
      --text: #111;
      --muted: #555;
      --line: #d7d7d7;
      --soft: #f5f5f5;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    button, select, textarea { font: inherit; }

    button, select {
      color: #111;
      background: #fff;
      border: 1px solid #999;
      border-radius: 4px;
    }

    button {
      min-height: 38px;
      padding: 7px 12px;
      cursor: pointer;
    }

    button:hover, button:focus-visible { background: #eee; }
    button.active { color: #fff; background: #111; border-color: #111; }
    button.danger { border-color: #777; }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    .site-header {
      padding-bottom: 20px;
      border-bottom: 2px solid #111;
    }

    .site-header h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.15;
    }

    .site-header p { margin: 0; color: var(--muted); }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.97);
    }

    .control-row {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 18px 0 12px;
    }

    .control-row select { width: 100%; min-height: 42px; padding: 8px 10px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .notice {
      margin: 18px 0;
      padding: 12px 14px;
      background: var(--soft);
      border-left: 4px solid #111;
    }

    .document {
      max-width: 980px;
      margin: 0 auto;
      padding: 30px 0;
    }

    .document h1 { margin: 0 0 18px; font-size: 32px; line-height: 1.2; }
    .document h2 { margin: 30px 0 12px; padding-bottom: 5px; border-bottom: 1px solid #aaa; font-size: 22px; }
    .document h3 { margin: 24px 0 8px; font-size: 18px; }
    .document p { margin: 8px 0 12px; }
    .document ul, .document ol { margin: 8px 0 16px; padding-left: 24px; }
    .document li { margin: 4px 0; }
    .document blockquote { margin: 12px 0; padding: 8px 14px; border-left: 3px solid #777; background: var(--soft); }
    .document code { font-family: Consolas, monospace; background: #eee; padding: 1px 4px; }
    .document table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
    .document th, .document td { padding: 8px; border: 1px solid #aaa; vertical-align: top; text-align: left; }
    .document th { background: #eee; }

    .heading-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .heading-row h2, .heading-row h3 { flex: 1; }

    .copy-section {
      min-height: 30px;
      padding: 4px 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .editor {
      width: 100%;
      min-height: 68vh;
      padding: 18px;
      color: #111;
      background: #fff;
      border: 1px solid #777;
      border-radius: 0;
      resize: vertical;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      max-width: 360px;
      padding: 10px 14px;
      color: #fff;
      background: #111;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .18s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 760px) {
      .page { width: min(100% - 20px, 1180px); padding-top: 18px; }
      .nav { position: static; }
      .control-row { grid-template-columns: 1fr; }
      .document { padding-top: 22px; }
      .document h1 { font-size: 27px; }
      .heading-row { align-items: flex-start; }
      .document table { display: block; overflow-x: auto; }
    }

    @media print {
      body { font-size: 11pt; }
      .page { width: 100%; padding: 0; }
      .site-header, .nav, .control-row, .toolbar, .notice, .footer, .toast, .copy-section { display: none !important; }
      .document { max-width: none; padding: 0; }
      .document h1 { font-size: 22pt; }
      .document h2 { font-size: 15pt; break-after: avoid; }
      .document h3 { font-size: 12pt; break-after: avoid; }
      .document li, .document p { break-inside: avoid; }
      .editor { border: 0; min-height: 0; resize: none; }
    }
  </style>
</head>

br><br>работа с договорами. |\n| 06.2015 | 05.2016 | ИП Букреев М.А. | Ведущий специалист грузовых перевозок<br><br>(должностные обязанности): прием Заключение договоров с обслуживающими организациями;<br><br>Контроль и соблюдение договорных условий;<br><br>Ведение документации;<br><br>Планирование и координация работы водителей;<br><br>Решение конфликтных вопросов. |\n| 05.2016 | 02.2019 | АО «РЖД Логистика» | Ведущий специалист Должностные обязанности:<br><br>Обработка входящих запросов от клиентов; Поиск транспортных решений по запросам клиентов; Подготовка и оформление закрывающих документов по закрытым заявкам клиентов; Обработка и распределение бухгалтерских и транспортных документов от соисполнителей; Внесение данных по перевозкам в информационные программы; работа с платежными документами; Работа на электронных торговых площадках. |\n| 02.2019 | 04.2023 | АО «РЖД Логистика» | Заместитель начальника отдела<br><br>Должностные обязанности:<br><br>Распределение обязанностей  внутри отдела;<br><br>Подготовка отчетов;<br><br>Контроль и снижение дебиторской задолженности от клиентов; Поиск и привлечение новых соисполнителей; Работа и разрешение спорных ситуаций с клиентами и соисполнителями; Выбор оптимального транспортного решения при сложных мультимодальных перевозках; Перевозки негабаритных грузов; Работа с госконтрактами по спецсчетам; Котировка ставок по запросам клиентов.<br><br><br><br> |\n|  |  |  |  |\n| 12.2023 | 07.2025 | ООО \"Предо\" | Логист<br><br>Должностные обязанности:<br><br>Поиск наемного транспорта для отправки продукции компании(рефрижераторов с температурным режимом, в том числе контейнеров);<br><br>Поиск грузов для автопарка компании; Поиск и заключение договоров с транспортными компаниями;<br><br>Подготовка и оформление закрывающих документов по закрытым заявкам от транспортных компаний в 1С;<br><br> |"}, {"id": "standard-1", "group": "standard", "title": "Руководитель отдела транспортной логистики", "editable": false, "content": "# Сергей Васильевич Амелехин\n\nТелефон: 8-916-604-82-12  \nЭлектронная почта: amserg1978@gmail.com\n\n## Желаемая должность\n\n**Руководитель отдела транспортной логистики**\n\n## Профессиональный профиль\n\nРуководитель и специалист по транспортной логистике с опытом работы более 20 лет. Более 4 лет работал заместителем начальника отдела в АО «РЖД Логистика». Организовывал работу сотрудников, готовил управленческую отчётность, взаимодействовал с клиентами и соисполнителями, участвовал в контроле дебиторской задолженности.\n\nПрактический опыт охватывает автомобильные, контейнерные, мультимодальные и негабаритные перевозки, включая перевозки с температурным режимом. Работал с перевозчиками, тарифами, договорами, транспортной и бухгалтерской документацией, электронными торговыми площадками и государственными контрактами по специальным счетам.\n\n## Ключевые компетенции\n\n- Управление отделом транспортной логистики\n- Организация грузовых перевозок\n- Автомобильные перевозки\n- Мультимодальные перевозки\n- Контейнерные перевозки\n- Негабаритные перевозки\n- Перевозки с температурным режимом\n- Управление перевозчиками и соисполнителями\n- Распределение задач и контроль исполнения\n- Оптимизация транспортных решений и маршрутов\n- Расчёт и котировка ставок\n- Договорная работа\n- Контроль транспортного документооборота\n- Контроль дебиторской задолженности\n- Урегулирование спорных ситуаций\n- Работа с государственными контрактами\n- Электронные торговые площадки\n- 1С\n\n## Опыт работы\n\n### ООО «Предо»\n\n**Логист**  \nДекабрь 2023 — июль 2025\n\n- Подбор наёмного транспорта для перевозки продукции компании, включая рефрижераторы и контейнеры с температурным режимом.\n- Поиск грузов для собственного автопарка.\n- Поиск транспортных компаний и заключение договоров.\n- Подготовка и оформление в 1С закрывающих документов по выполненным заявкам перевозчиков.\n\n### АО «РЖД Логистика»\n\n**Заместитель начальника отдела**  \nФевраль 2019 — апрель 2023\n\n- Распределение обязанностей внутри отдела и координация текущей работы.\n- Подготовка отчётности.\n- Контроль и снижение дебиторской задолженности клиентов.\n- Поиск и привлечение новых соисполнителей.\n- Урегулирование спорных ситуаций с клиентами и соисполнителями.\n- Выбор транспортных решений для сложных мультимодальных перевозок.\n- Организация перевозок негабаритных грузов.\n- Работа с государственными контрактами по специальным счетам.\n- Котировка ставок по запросам клиентов.\n\n**Ведущий специалист**  \nМай 2016 — февраль 2019\n\n- Обработка входящих запросов клиентов и подбор транспортных решений.\n- Подготовка и оформление закрывающих документов по выполненным клиентским заявкам.\n- Обработка и распределение бухгалтерских и транспортных документов соисполнителей.\n- Внесение данных о перевозках в информационные системы.\n- Работа с платёжными документами.\n- Работа на электронных торговых площадках.\n\n### ИП Букреев М. А.\n\n**Ведущий специалист грузовых перевозок**  \nИюнь 2015 — май 2016\n\n- Заключение договоров с обслуживающими организациями.\n- Контроль соблюдения договорных условий.\n- Ведение документации.\n- Планирование и координация работы водителей.\n- Решение конфликтных вопросов.\n\n### ООО «Дом Одежды», торговая марка ZENDEN\n\n**Ведущий менеджер отдела транспортной логистики**  \nАвгуст 2012 — март 2015\n\n- Взаимодействие с транспортными компаниями и расширение базы перевозчиков.\n- Координация работы со складом, магазинами и офисом.\n- Разработка схем доставки товаров по России и контроль перевозок на всех этапах.\n- Урегулирование спорных вопросов с перевозчиками.\n- Формирование тарифной сетки и расчёт стоимости перевозок по заявкам.\n- Оформление заявок на автотранспорт и контроль его подачи и движения по маршруту.\n- Ведение договоров, транспортного документооборота и отчётности.\n\n### ООО «ГРУЗОВОЗОФФ»\n\n**Менеджер транспортного отдела**  \nНоябрь 2006 — июнь 2012\n\n- Планирование, контроль и координация движения автотранспорта.\n- Взаимодействие с транспортными компаниями.\n- Разработка и оптимизация маршрутов доставки, формирование машин.\n- Ведение документации.\n\n### ООО ТФ «АСА+»\n\n**Специалист по БДД и грузовым перевозкам / менеджер по грузовым перевозкам автомобильным транспортом**  \nМарт 2001 — ноябрь 2006\n\n- Заключение договоров с обслуживающими организациями и контроль договорных условий.\n- Руководство техническим персоналом.\n- Планирование и координация работы водителей.\n- Учёт ремонта и технического обслуживания транспортных средств.\n- Ведение документации и решение конфликтных вопросов.\n\n## Обо мне\n\nБолее 20 лет работаю в транспортной логистике. Знаю операционную работу с перевозками и управленческий контур: распределение задач, отчётность, взаимодействие с клиентами и подрядчиками, договоры, ставки, документы и дебиторская задолженность. Имею опыт организации сложных мультимодальных и негабаритных перевозок, работы с государственными контрактами и электронными торговыми площадками."}, {"id": "standard-2", "group": "standard", "title": "Заместитель руководителя отдела логистики", "editable": false, "content": "# Сергей Васильевич Амелехин\n\nТелефон: 8-916-604-82-12  \nЭлектронная почта: amserg1978@gmail.com\n\n## Желаемая должность\n\n**Заместитель руководителя отдела логистики**\n\n## Профессиональный профиль\n\nСпециалист по транспортной логистике с опытом более 20 лет, включая более 4 лет в должности заместителя начальника отдела АО «РЖД Логистика». Координировал работу внутри отдела, готовил отчётность, взаимодействовал с клиентами и соисполнителями, участвовал в контроле дебиторской задолженности и подборе транспортных решений.\n\nРазбираюсь в операционном и административном контуре логистики: от обработки запроса, расчёта ставки и выбора перевозчика до контроля документов и закрытия заявки. Имею опыт мультимодальных, негабаритных, автомобильных и контейнерных перевозок, государственных контрактов и электронных торговых площадок.\n\n## Ключевые компетенции\n\n- Координация работы отдела логистики\n- Распределение обязанностей и контроль задач\n- Организация транспортной логистики\n- Работа с клиентами и соисполнителями\n- Подбор транспортных решений\n- Мультимодальные перевозки\n- Негабаритные перевозки\n- Автомобильные перевозки\n- Контейнерные перевозки\n- Работа с перевозчиками\n- Котировка и расчёт ставок\n- Контроль дебиторской задолженности\n- Управленческая отчётность\n- Договорная работа\n- Транспортный документооборот\n- Урегулирование спорных ситуаций\n- Государственные контракты\n- Электронные торговые площадки\n- 1С\n\n## Опыт работы\n\n### ООО «Предо»\n\n**Логист**  \nДекабрь 2023 — июль 2025\n\n- Подбирал наёмный транспорт для перевозки продукции компании, включая рефрижераторы и контейнеры с температурным режимом.\n- Искал грузы для собственного автопарка.\n- Подбирал транспортные компании и заключал договоры.\n- Готовил и оформлял в 1С закрывающие документы по выполненным заявкам перевозчиков.\n\n### АО «РЖД Логистика»\n\n**Заместитель начальника отдела**  \nФевраль 2019 — апрель 2023\n\n- Распределял обязанности внутри отдела и координировал выполнение текущих задач.\n- Готовил отчётность по работе отдела.\n- Контролировал работу по снижению дебиторской задолженности клиентов.\n- Искал и привлекал новых соисполнителей.\n- Разрешал спорные ситуации с клиентами и соисполнителями.\n- Подбирал оптимальные транспортные решения для сложных мультимодальных перевозок.\n- Работал с перевозками негабаритных грузов.\n- Сопровождал государственные контракты по специальным счетам.\n- Котировал ставки по клиентским запросам.\n\n**Ведущий специалист**  \nМай 2016 — февраль 2019\n\n- Обрабатывал входящие запросы клиентов и подбирал транспортные решения.\n- Готовил закрывающие документы по выполненным заявкам.\n- Обрабатывал и распределял бухгалтерские и транспортные документы соисполнителей.\n- Вносил сведения о перевозках в информационные системы.\n- Работал с платёжными документами и электронными торговыми площадками.\n\n### ИП Букреев М. А.\n\n**Ведущий специалист грузовых перевозок**  \nИюнь 2015 — май 2016\n\n- Заключал договоры с обслуживающими организациями и контролировал соблюдение условий.\n- Вёл документацию.\n- Планировал и координировал работу водителей.\n- Урегулировал конфликтные вопросы.\n\n### ООО «Дом Одежды», торговая марка ZENDEN\n\n**Ведущий менеджер отдела транспортной логистики**  \nАвгуст 2012 — март 2015\n\n- Взаимодействовал с перевозчиками и расширял базу транспортных компаний.\n- Координировал работу со складом, магазинами и офисом.\n- Разрабатывал схемы доставки по России и контролировал все этапы перевозки.\n- Формировал тарифную сетку, рассчитывал стоимость и оформлял заявки на транспорт.\n- Контролировал подачу транспорта и движение по маршруту.\n- Вёл договоры, транспортные документы и отчётность.\n- Урегулировал спорные вопросы с перевозчиками.\n\n### ООО «ГРУЗОВОЗОФФ»\n\n**Менеджер транспортного отдела**  \nНоябрь 2006 — июнь 2012\n\n- Планировал и координировал движение автотранспорта.\n- Взаимодействовал с транспортными компаниями.\n- Разрабатывал и оптимизировал маршруты доставки, формировал машины.\n- Вёл документацию.\n\n### ООО ТФ «АСА+»\n\n**Специалист по БДД и грузовым перевозкам / менеджер по грузовым перевозкам автомобильным транспортом**  \nМарт 2001 — ноябрь 2006\n\n- Заключал договоры с обслуживающими организациями и контролировал договорные условия.\n- Руководил техническим персоналом.\n- Планировал и координировал работу водителей.\n- Вёл учёт ремонта и технического обслуживания транспортных средств.\n- Вёл документацию и решал конфликтные вопросы.\n\n## Обо мне\n\nСочетаю управленческий опыт с глубоким знанием ежедневной работы транспортной логистики. Могу координировать сотрудников и одновременно погружаться в сложные перевозки, работу с клиентами, перевозчиками, ставками, договорами и закрывающими документами. Основная специализация — организация грузовых перевозок и обеспечение устойчивой работы логистического подразделения."}, {"id": "standard-3",  Оптимизация маршрутов доставки\n- Расчёт стоимости перевозок\n- Оформление заявок на транспорт\n- Контроль подачи и движения транспорта\n- Рефрижераторные перевозки\n- Контейнерные перевозки\n- Перевозки с температурным режимом\n- Работа с водителями\n- Договорная работа\n- Транспортные и закрывающие документы\n- 1С\n\n## Опыт работы\n\n### ООО «Предо»\n\n**Логист**  \nДекабрь 2023 — июль 2025\n\n- Искал наёмный транспорт для отправки продукции компании.\n- Подбирал рефрижераторы и контейнеры для перевозок с температурным режимом.\n- Искал грузы для собственного автопарка.\n- Подбирал транспортные компании и заключал договоры.\n- Готовил и оформлял в 1С закрывающие документы по выполненным заявкам перевозчиков.\n\n### АО «РЖД Логистика»\n\n**Заместитель начальника отдела**  \nФевраль 2019 — апрель 2023\n\n- Подбирал транспортные решения для сложных мультимодальных перевозок.\n- Работал с перевозками негабаритных грузов.\n- Котировал ставки по клиентским запросам.\n- Взаимодействовал с клиентами и соисполнителями, решал спорные ситуации.\n- Искал и привлекал новых соисполнителей.\n- Работал с государственными контрактами по специальным счетам.\n- Участвовал в контроле дебиторской задолженности.\n- Распределял обязанности внутри отдела и готовил отчётность.\n\n**Ведущий специалист**  \nМай 2016 — февраль 2019\n\n- Обрабатывал запросы клиентов и подбирал транспортные решения.\n- Оформлял закрывающие документы по выполненным заявкам.\n- Обрабатывал бухгалтерские и транспортные документы соисполнителей.\n- Вносил сведения о перевозках в информационные системы.\n- Работал с платёжными документами и электронными торговыми площадками.\n\n### ИП Букреев М. А.\n\n**Ведущий специалист грузовых перевозок**  \nИюнь 2015 — май 2016\n\n- Заключал договоры с обслуживающими организациями.\n- Контролировал соблюдение договорных условий.\n- Планировал и координировал работу водителей.\n- Вёл документацию и решал конфликтные вопросы.\n\n### ООО «Дом Одежды», торговая марка ZENDEN\n\n**Ведущий менеджер отдела транспортной логистики**  \nАвгуст 2012 — март 2015\n\n- Взаимодействовал с транспортными компаниями и расширял базу перевозчиков.\n- Разрабатывал схемы доставки товаров по России.\n- Рассчитывал стоимость перевозок и формировал тарифную сетку.\n- Оформлял заявки на автотранспорт.\n- Контролировал своевременную подачу транспорта и движение по маршруту.\n- Вёл договоры, транспортные документы и отчётность.\n- Взаимодействовал со складом, магазинами и офисом.\n\n### ООО «ГРУЗОВОЗОФФ»\n\n**Менеджер транспортного отдела**  \nНоябрь 2006 — июнь 2012\n\n- Планировал и координировал движение автотранспорта.\n- Работал с транспортными компаниями.\n- Разрабатывал и оптимизировал маршруты доставки, формировал машины.\n- Вёл документацию.\n\n### ООО ТФ «АСА+»\n\n**Специалист по БДД и грузовым перевозкам / менеджер по грузовым перевозкам автомобильным транспортом**  \nМарт 2001 — ноябрь 2006\n\n- Планировал и координировал работу водителей.\n- Заключал договоры с обслуживающими организациями и контролировал их исполнение.\n- Вёл учёт ремонта и технического обслуживания транспортных средств.\n- Руководил техническим персоналом.\n- Вёл документацию и решал конфликтные вопросы.\n\n## Обо мне\n\nПрактический специалист по автомобильным грузоперевозкам. Умею оперативно подобрать транспорт, перевозчика и маршрут, рассчитать стоимость, оформить заявку, проконтролировать движение и закрывающие документы. Понимаю работу водителей, собственного автопарка, транспортных компаний и внутренних подразделений заказчика."}, {"id": "xyz-1", "group": "xyz", "title": "Руководитель отдела транспортной логистики — XYZ", "editable": true, "content": "# Сергей Васильевич Амелехин\n\nТелефон: 8-916-604-82-12  \nЭлектронная почта: amserg1978@gmail.com\n\n## Желаемая должность\n\n**Руководитель отдела транспортной логистики**\n\n## Профессиональный профиль\n\nРуководитель и специалист по транспортной логистике с опытом более 20 лет, включая более 4 лет в должности заместителя начальника отдела АО «РЖД Логистика». Управлял текущей работой подразделения, распределял задачи, контролировал дебиторскую задолженность, взаимодействовал с клиентами, перевозчиками и соисполнителями.\n\nЭкспертиза охватывает автомобильные, контейнерные, мультимодальные, негабаритные и рефрижераторные перевозки. Знаю полный цикл транспортной логистики: от обработки запроса, выбора схемы и расчёта ставки до контроля исполнения, документооборота и закрытия заявки.\n\n## Ключевые компетенции\n\n- Управление отделом транспортной логистики\n- Управление сотрудниками и распределение задач\n- Организация грузовых перевозок\n- Управление перевозчиками и соисполнителями\n- Автомобильные и контейнерные перевозки\n- Мультимодальные и негабаритные перевозки\n- Перевозки с температурным режимом\n- Оптимизация транспортных решений и маршрутов\n- Расчёт и котировка ставок\n- Контроль дебиторской задолженности\n- Управленческая отчётность\n- Договорная работа\n- Транспортный документооборот\n- Государственные контракты\n- Электронные торговые площадки\n- 1С\n\n## Опыт работы\n\n### ООО «Предо»\n\n**Логист**  \nДекабрь 2023 — июль 2025\n\n- Обеспечивал подбор наёмного транспорта [X автомобилей или контейнеров в месяц / Y% заявок закрыто в срок], работая с транспортными компаниями и перевозчиками.\n- Организовал перевозки продукции с температурным режимом [X перевозок / X тонн за период], подбирая рефрижераторы и контейнеры под требования заявок.\n- Обеспечивал загрузку собственного автопарка [на уровне X% / X рейсов в месяц], подбирая подходящие грузы.\n- Расширил базу транспортных компаний [на X перевозчиков / X%], организовав поиск и заключение договоров.\n- Обеспечил оформление в 1С закрывающих документов [по X заявкам / с долей возвратов не более Y%], контролируя полноту документов перевозчиков.\n\n### АО «РЖД Логистика»\n\n**Заместитель начальника отдела**  \nФевраль 2019 — апрель 2023\n\n- Координировал работу отдела[ численностью X сотрудников] и обработку клиентских запросов[ — X запросов или перевозок в месяц], распределяя обязанности и контролируя текущие задачи.\n- Снизил дебиторскую задолженность клиентов[ на X% / X руб. / с X до Y за период][ за счёт подтверждённого способа контроля задолженности и работы с клиентами].\n- Привлёк новых соисполнителей[ — X компаний / увеличение базы на X%][, используя подтверждённые каналы поиска и критерии отбора].\n- Организовал сложные мультимодальные и негабаритные перевозки [X перевозок / объёмом X тонн / стоимостью X руб.], подбирая оптимальные транспортные решения под запросы клиентов.\n- Обеспечил выполнение клиентских заявок [X заявок в месяц / Y% заявок в согласованный срок], распределяя работу внутри отдела и контролируя исполнение.\n- Сократил срок подготовки ставок[ с X до Y / на X%][ за счёт изменения порядка расчёта и согласования с соисполнителями].\n- Обеспечил сопровождение государственных контрактов [X контрактов общей стоимостью X руб.], организовав работу со специальными счетами и необходимыми документами.\n- Снизил количество спорных ситуаций с клиентами и соисполнителями[ на X% / с X до Y случаев][ за счёт подтверждённого способа предупреждения и урегулирования разногласий].\n\n**Ведущий специалист**  \nМай 2016 — февраль 2019\n\n- Обрабатывал клиентские запросы[ — X в месяц], соблюдая согласованный срок подготовки решения[ — Y часов / дней / Y% запросов в срок] и подбирая транспортные схемы и соисполнителей.\n- Обеспечил корректное оформление закрывающих документов [по X заявкам / с долей возвратов не более Y%], контролируя комплектность бухгалтерских и транспортных документов.\n- Сократил срок обработки документов [с X до Y / на X%], упорядочив их получение, распределение и внесение данных в информационные системы.\n- Обеспечивал работу с электронными торговыми площадками [X площадок / X процедур за период], готовя и сопровождая необходимые документы.\n\n### ИП Букреев М. А.\n\n**Ведущий специалист грузовых перевозок**  \nИюнь 2015 — май 2016\n\n- Координировал работу водителей и автомобилей[ — X водителей / X автомобилей], обеспечивая выполнение рейсов и заявок[ — X в месяц / Y% в срок].\n- Обеспечивал соблюдение договорных условий [по X договорам / Y% контрагентов], контролируя исполнение обязательств обслуживающих организаций.\n- Решал конфликтные вопросы[ — X обращений за период / сокращение числа повторных обращений на Y%].\n\n### ООО «Дом Одежды», торговая марка ZENDEN\n\n**Ведущий менеджер отдела транспортной логистики**  \nАвгуст 2012 — март 2015\n\n- Расширил базу перевозчиков [на X компаний / X%], организовав системный поиск и взаимодействие с транспортными компаниями.\n- Оптимизировал схемы доставки товаров по России[ для X направлений / X магазинов][ с подтверждённым снижением срока или стоимости].\n- Снизил стоимость перевозок [на X% / X руб. за период], сформировав тарифную сетку и сравнивая предложения перевозчиков.\n- Организовал доставку товаров [в X магазинов / по X маршрутам / X перевозок в месяц], координируя перевозчиков, склад, магазины и офис.\n- Обеспечил своевременную подачу транспорта [по Y% из X заявок], контролируя оформление заявок и движение машин по маршруту.\n\n### ООО «ГРУЗОВОЗОФФ»\n\n**Менеджер транспортного отдела**  \nНоябрь 2006 — июнь 2012\n\n- Координировал движение автотранспорта[ — X автомобилей / X рейсов в месяц], обеспечивая своевременную подачу и доставку[ на уровне Y%].\n- Оптимизировал маршруты доставки[ по X направлениям][ с подтверждённым сокращением пробега, срока или стоимости].\n- Формировал транспорт под клиентские заявки [X машин в месяц / Y% заявок закрыто в срок], взаимодействуя с транспортными компаниями.\n\n### ООО ТФ «АСА+»\n\n**Специалист по БДД и грузовым перевозкам / менеджер по грузовым перевозкам автомобильным транспортом**  \nМарт 2001 — ноябрь 2006\n\n- Координировал работу водителей и технического персонала[ — X водителей и X сотрудников], обеспечивая выполнение рейсов и заявок[ — X в месяц].\n- Обеспечивал техническую готовность автопарка [из X транспортных средств / на уровне Y%], контролируя ремонт и техническое обслуживание.\n- Снизил количество простоев транспорта [на X% / с X до Y часов или дней], организовав учёт ремонта и технического обслуживания.\n- Обеспечивал соблюдение договорных условий [по X договорам / Y% обслуживающих организаций], контролируя работу контрагентов.\n\n## Обо мне\n\nБолее 20 лет работаю в транспортной логистике. Сочетаю управленческий опыт с глубоким знанием операционной работы: организация сотрудников, перевозок, взаимодействия с клиентами и подрядчиками, расчёта ставок, договоров и документооборота. Имею опыт сложных мультимодальных и негабаритных перевозок, государственных контрактов и электронных торговых площадок."}, {"id": "xyz-2", "group": "xyz", "title": "Заместитель руководителя отдела логистики — XYZ", "editable": true, "content": "# Сергей Васильевич Амелехин\n\nТелефон: 8-916-604-82-12  \nЭлектронная почта: amserg1978@gmail.com\n\n## Желаемая должность\n\n**Заместитель руководителя отдела логистики**\n\n## Профессиональный профиль\n\nСпециалист по транспортной логистике с опытом более 20 лет, из них более 4 лет — заместителем начальника отдела АО «РЖД Логистика». Координировал работу сотрудников, готовил отчётность, контролировал текущие задачи и дебиторскую задолженность, работал с клиентами и соисполнителями.\n\nПонимаю управленческий и операционный контур логистики. Подбирал транспортные решения и перевозчиков, рассчитывал ставки, сопровождал мультимодальные, негабаритные, автомобильные и контейнерные перевозки, государственные контракты и комплект документов.\n\n## Ключевые компетенции\n\n- Координация работы отдела логистики\n- Распределение обязанностей и контроль исполнения\n- Организация транспортной логистики\n- Работа с клиентами, перевозчиками и соисполнителями\n- Подбор транспортных решений\n- Мультимодальные и негабаритные перевозки\n- Автомобильные и контейнерные перевозки\n- Котировка и расчёт ставок\n- Контроль дебиторской задолженности\n- Отчётность\n- Договорная работа\n  X%], организовав поиск и заключение договоров.\n- Оформил в 1С закрывающие документы [по X заявкам / с долей возвратов не более Y%], контролируя комплектность документов перевозчиков.\n- Сократил время поиска транспорта[ с X до Y / на X%][, используя подтверждённую базу, площадки или иной способ].\n\n### АО «РЖД Логистика»\n\n**Заместитель начальника отдела**  \nФевраль 2019 — апрель 2023\n\n- Подобрал транспортные решения[ по X клиентским запросам / для X направлений][ с подтверждённым результатом по сроку, стоимости или качеству исполнения].\n- Организовал мультимодальные и негабаритные перевозки [X перевозок / объёмом X тонн], выбирая оптимальные транспортные схемы.\n- Рассчитал и согласовал ставки [по X запросам / со средним сроком ответа Y часов или дней], взаимодействуя с перевозчиками и соисполнителями.\n- Привлёк [X] новых соисполнителей, расширив доступную базу перевозчиков [на Y% / для X направлений].\n- Урегулировал спорные ситуации [X случаев / со снижением повторных обращений на Y%], согласовывая решения с клиентами и соисполнителями.\n- Снизил дебиторскую задолженность[ на X% / X руб. / с X до Y][ за счёт подтверждённого способа контроля и работы с клиентами].\n- Координировал работу сотрудников и обработку клиентских запросов[ — X сотрудников / X запросов в месяц], распределяя обязанности внутри отдела.\n\n**Ведущий специалист**  \nМай 2016 — февраль 2019\n\n- Обрабатывал запросы клиентов[ — X в месяц], подбирая транспортные решения[ в среднем за Y часов или дней].\n- Оформлял закрывающие документы [по X выполненным заявкам / с долей возвратов не более Y%], контролируя документы клиентов и соисполнителей.\n- Сократил срок обработки транспортных и бухгалтерских документов [с X до Y / на X%], упорядочив их распределение и внесение данных в информационные системы.\n- Сопровождал процедуры на электронных торговых площадках [X процедур за период / на X площадках], готовя необходимые документы.\n\n### ИП Букреев М. А.\n\n**Ведущий специалист грузовых перевозок**  \nИюнь 2015 — май 2016\n\n- Координировал работу водителей и автомобилей[ — X водителей / X автомобилей], обеспечивая выполнение рейсов и заявок[ — X в месяц / Y% в срок].\n- Контролировал исполнение договоров[ — X договоров], обеспечивая соблюдение условий обслуживающими организациями.\n- Решал конфликтные вопросы [X обращений за период / со снижением повторных обращений на Y%].\n\n### ООО «Дом Одежды», торговая марка ZENDEN\n\n**Ведущий менеджер отдела транспортной логистики**  \nАвгуст 2012 — март 2015\n\n- Организовал доставку товаров [в X магазинов / по X маршрутам / X перевозок в месяц], координируя перевозчиков, склад, магазины и офис.\n- Расширил базу перевозчиков [на X транспортных компаний / X%], организовав системный поиск и взаимодействие с подрядчиками.\n- Оптимизировал маршруты доставки[ по X направлениям][ с подтверждённым сокращением пробега, срока или стоимости].\n- Рассчитал стоимость и оформил заявки [для X перевозок в месяц], используя сформированную тарифную сетку.\n- Обеспечил своевременную подачу транспорта [по Y% из X заявок], контролируя движение машин по маршруту.\n\n### ООО «ГРУЗОВОЗОФФ»\n\n**Менеджер транспортного отдела**  \nНоябрь 2006 — июнь 2012\n\n- Координировал движение автотранспорта[ — X автомобилей / X рейсов в месяц], обеспечивая своевременную подачу и доставку[ на уровне Y%].\n- Оптимизировал маршруты доставки[ по X направлениям][ с подтверждённым сокращением пробега, срока или стоимости].\n- Формировал машины [под X заявок в месяц / с долей закрытия в срок Y%], взаимодействуя с транспортными компаниями.\n\n### ООО ТФ «АСА+»\n\n**Специалист по БДД и грузовым перевозкам / менеджер по грузовым перевозкам автомобильным транспортом**  \nМарт 2001 — ноябрь 2006\n\n- Координировал работу водителей и технического персонала[ — X водителей и X сотрудников], обеспечивая выполнение рейсов и заявок[ — X в месяц].\n- Поддерживал техническую готовность автопарка[ — X транспортных средств / на уровне Y%], контролируя ремонт и техническое обслуживание.\n- Снизил простои транспорта [на X% / с X до Y], организовав учёт ремонта и технического обслуживания.\n- Контролировал исполнение договоров[ — X договоров], обеспечивая соблюдение условий обслуживающими организациями.\n\n## Обо мне\n\nПрактический специалист по автомобильным грузоперевозкам. Умею подобрать транспорт, перевозчика и маршрут, рассчитать стоимость, оформить заявку, проконтролировать движение и закрывающие документы. Понимаю работу водителей, собственного автопарка, транспортных компаний и внутренних подразделений заказчика."}, {"id": "letter-1", "group": "letters", "title": "Письмо: руководитель отдела транспортной логистики", "editable": false, "content": "# Сопроводительное письмо\n\n## Для вакансии «Руководитель отдела транспортной логистики»\n\nЗдравствуйте!\n\nПрошу рассмотреть мою кандидатуру на вакансию руководителя отдела транспортной логистики.\n\nБолее 20 лет работаю в сфере грузовых перевозок и транспортной логистики. Более 4 лет занимал должность заместителя начальника отдела в АО «РЖД Логистика»: координировал работу сотрудников, готовил отчётность, взаимодействовал с клиентами и соисполнителями, участвовал в контроле дебиторской задолженности и организации сложных перевозок.\n\nЗнаю как управленческий, так и операционный контур логистики. Работал с автомобильными, контейнерными, мультимодальными и негабаритными перевозками, рефрижераторами и температурными режимами. Имею практический опыт подбора перевозчиков, расчёта ставок, договорной работы, контроля документов и урегулирования спорных ситуаций.\n\nГотов обсудить задачи вашего логистического подразделения и подробнее рассказать о релевантном опыте на собеседовании.\n\nС уважением,  \nСергей Амелехин  \n8-916-604-82-12  \namserg1978@gmail.com\n\n## Перед отправкой\n\nВ первом абзаце желательно указать точное название вакансии и добавить одно предложение о том, чем заинтересовала компания или её логистические задачи."}, {"id": "letter-2", "group": "letters", "title": "Письмо: заместитель руководителя отдела логистики", "editable": false, "content": "# Сопроводительное письмо\n\n## Для вакансии «Заместитель руководителя отдела логистики»\n\nЗдравствуйте!\n\nЗаинтересовала вакансия заместителя руководителя отдела логистики. Мой опыт соответствует задачам, связанным с координацией сотрудников, организацией перевозок и контролем текущей работы подразделения.\n\nБолее 20 лет работаю в транспортной логистике, в том числе более 4 лет — заместителем начальника отдела АО «РЖД Логистика». Распределял обязанности внутри отдела, готовил отчётность, работал с клиентами и соисполнителями, дебиторской задолженностью, ставками и государственными контрактами по специальным счетам.\n\nХорошо знаю полный цикл перевозки — от обработки запроса и выбора транспортного решения до сопровождения документов. Работал с мультимодальными, негабаритными, автомобильными и контейнерными перевозками, а также с перевозками, требующими соблюдения температурного режима.\n\nБуду рад обсудить, какие задачи стоят перед вашим отделом и чем мой опыт может быть полезен компании.\n\nС уважением,  \nСергей Амелехин  \n8-916-604-82-12  \namserg1978@gmail.com\n\n## Перед отправкой\n\nЗамените первое предложение на точное название вакансии. Добавьте одну конкретную причину интереса к компании, взятую из описания вакансии."}, {"id": "letter-3", "group": "letters", "title": "Письмо: ведущий менеджер по транспортной логистике", "editable": false, "content": "# Сопроводительное письмо\n\n## Для вакансии «Ведущий менеджер по транспортной логистике»\n\nЗдравствуйте!\n\nПрошу рассмотреть мою кандидатуру на вакансию ведущего менеджера по транспортной логистике.\n\nУ меня более 20 лет опыта в организации грузовых перевозок. Подбирал перевозчиков и транспортные решения, рассчитывал и котировал ставки, разрабатывал маршруты, контролировал подачу и движение транспорта, сопровождал договоры и закрывающие документы.\n\nРаботал с автомобильными, контейнерными, мультимодальными и негабаритными перевозками, а также с рефрижераторами и температурными режимами. Имею опыт взаимодействия с клиентами, транспортными компаниями и внутренними подразделениями, работы в 1С и на электронных торговых площадках.\n\nГотов подробнее рассказать о своём опыте и обсудить задачи вакансии на собеседовании.\n\nС уважением,  \nСергей Амелехин  \n8-916-604-82-12  \namserg1978@gmail.com\n\n## Перед отправкой\n\nУкажите точное название вакансии. Если в вакансии назван приоритетный тип перевозок, вынесите его в третий абзац первым."}, {"id": "letter-4", "group": "letters", "title": "Письмо: логист по автомобильным перевозкам", "editable": false, "content": "# Сопроводительное письмо\n\n## Для вакансии «Логист по автомобильным перевозкам»\n\nЗдравствуйте!\n\nЗаинтересовала вакансия логиста по автомобильным перевозкам. Имею более 20 лет практического опыта в транспортной логистике и хорошо знаю полный цикл организации грузоперевозки.\n\nВ мои задачи входили поиск транспорта и грузов, подбор перевозчиков, разработка маршрутов, расчёт стоимости, оформление заявок, контроль движения транспорта и подготовка закрывающих документов. Работал с собственным и наёмным автопарком, рефрижераторами, контейнерами и перевозками с температурным режимом.\n\nУмею выстраивать рабочее взаимодействие с водителями, транспортными компаниями, клиентами, складами и другими подразделениями. Работал с договорами, транспортной документацией и 1С.\n\nБуду рад обсудить вакансию и ответить на ваши вопросы на собеседовании.\n\nС уважением,  \nСергей Амелехин  \n8-916-604-82-12  \namserg1978@gmail.com\n\n## Перед отправкой\n\nУкажите точное название вакансии и добавьте одну фразу о наиболее релевантном для работодателя типе перевозок."}, {"id": "xyz-block", "group": "work", "title": "Блок достижений XYZ для заполнения", "editable": true, "content": "# Блок достижений по формуле XYZ\n\nФормула: **достиг X, что подтверждается показателем Y, благодаря действиям Z**.\n\nЭтот файл является рабочей заготовкой. Текст в квадратных скобках можно:\n\n- заменить фактическими цифрами и пояснениями;\n- удалить целиком, если точные данные невозможно подтвердить;\n- удалить вместе со всем пунктом, если Сергей не может подтвердить сам результат.\n\nПосле заполнения в каждое резюме следует перенести только наиболее релевантные достижения: 2–4 пункта для последних мест работы и 1–2 пункта для более ранних.\n\n## АО «РЖД Логистика» — заместитель начальника отдела\n\n- Снизил дебиторскую задолженность клиентов [на **X% / X руб. / с X до Y** за **период**], организовав [**способ контроля задолженности и работы с клиентами**].\n- Привлёк новых соисполнителей [**X компаний / увеличил базу на X%**], используя [**каналы поиска и критерии отбора**].\n- Организовал сложные мультимодальные и негабаритные перевозки [**X перевозок за период / объёмом X тонн / стоимостью X руб.**], подбирая оптимальные транспортные решения под запросы клиентов.\n- Обеспечил выполнение клиентских заявок [**X заявок в месяц / Y% заявок в согласованный срок**], распределяя обязанности внутри отдела и контролируя исполнение.\n- Сократил срок подготовки ставок [**с X до Y / на X%**], изменив [**порядок расчёта, взаимодействия с соисполнителями или согласования**].\n- Снизил количество спорных ситуаций с клиентами и соисполнителями [**на X% / с X до Y случаев**], внедрив [**способ предупреждения и урегулирования разногласий**].\n- Обеспечил сопровождение государственных контрактов [**X контрактов общей стоимостью X руб.**], организовав работу со специальными счетами и необходимыми документами.\n- Координировал работу отдела численностью [**X сотрудников**], обеспечивая обработку [**X запросов или перевозок в месяц**] за счёт распределения обязанностей и контроля текущих задач.\n\n## АО «РЖД Логистика» — ведущий специалист\n\n- Обрабатывал [**X клиентских запросов в месяц**] с соблюдением срока подготовки решения [**Y часов / дней / Y% запросов в срок**], подбирая подходящих соисполнителей и транспортные схемы.\n- Обеспечил корректное оформление закрывающих документов [**по X заявкам / с долей возвратов не более Y%**], контролируя комплектность бухгалтерских и транспортных документов.\n- Сократил срок обработки документов [**с X до Y / на X%**], упорядочив их получение, распределение и внесение данных в информационные системы.\n- Обеспечил работу с электронными торговыми площадками [**X площадок / X процедур за период / X выигранных процедур**], готовя и сопровождая [**виды заявок или документов**].\n- Подобрал транспортные решения [**для X клиентов / по X заявкам**], обеспечив [**подтверждённый результат: срок, стоимость или качество исполнения**].\n\n## ООО «Предо» — логист\n\n- Обеспечивал подбор наёмного транспорта [**X автомобилей или контейнеров в месяц / Y% заявок закрыто в срок**], работая с транспортными компаниями и перевозчиками.\n- Организовал перевозки продукции с температурным режимом [**X перевозок / X тонн за период**], подбирая рефрижераторы и контейнеры под требования заявок.\n- Нашёл грузы для собственного автопарка [**X машин или рейсов в месяц / обеспечив загрузку на Y%**], используя [**источники поиска грузов**].\n- Расширил базу транспортных компаний [**на X перевозчиков / X%**], организовав поиск, проверку и заключение договоров.\n- Оформил в 1С закрывающие документы [**по X заявкам / с долей возвратов не более Y%**], контролируя полноту документов от транспортных компаний.\n- Сократил время поиска транспорта [**с X до Y / на X%**], используя [**базу перевозчиков, площадки или иной подтверждённый способ**].\n\n## ООО «Дом Одежды», торговая марка ZENDEN\n\n- Расширил базу перевозчиков [**на X компаний / X%**], организовав системный поиск и взаимодействие с транспортными компаниями.\n- Оптимизировал схемы доставки товаров по России [**для X направлений / X магазинов**], обеспечив [**снижение срока на X% / снижение стоимости на X% / другой подтверждённый результат**].\n- Снизил стоимость перевозок [**на X% / X руб. за период**], сформировав тарифную сетку и сравнивая предложения перевозчиков.\n- Обеспечил своевременную подачу транспорта [**по Y% из X заявок**], контролируя оформление заявок и движение машин по маршруту.\n- Организовал доставку товаров [**в X магазинов / по X маршрутам / X перевозок в месяц**], координируя работу перевозчиков, склада, магазинов и офиса.\n- Сократил количество спорных ситуаций с перевозчиками [**на X% / с X до Y случаев**], внедрив [**подтверждённый способ контроля или взаимодействия**].\n\n## ИП Букреев М. А.\n\n- Координировал работу [**X водителей / X автомобилей**], обеспечивая выполнение [**X рейсов или заявок в месяц / Y% заявок в срок**].\n- Обеспечил соблюдение договорных условий [**по X договорам / Y% контрагентов**], контролируя исполнение обязательств обслуживающих организаций.\n- Снизил количество конфликтных ситуаций [**на X% / с X до Y случаев**], используя [**подтверждённый способ урегулирования**].\n\n## ООО «ГРУЗОВОЗОФФ»\n\n- Координировал движение [**X автомобилей / X рейсов в месяц**], обеспечивая [**Y% своевременных подач или доставок**].\n- Оптимизировал маршруты доставки [**по X направлениям**], добившись [**сокращения пробега, срока или стоимости на X%**].\n- Сформировал транспорт под клиентские заявки [**X машин в месяц / Y% заявок закрыто в срок**], взаимодействуя с транспортными компаниями.\n- Сократил время планирования перевозок [**с X до Y / на X%**], применив [**подтверждённое изменение процесса**].\n\n## ООО ТФ «АСА+»\n\n- Координировал работу [**X водителей и X сотрудников технического персонала**], обеспечивая выполнение [**X рейсов или заявок в месяц**].\n- Обеспечил техническую готовность автопарка [**из X транспортных средств / на уровне Y%**], контролируя ремонт и техническое обслуживание.\n- Снизил количество простоев транспорта [**на X% / с X до Y часов или дней**], организовав учёт ремонта и технического обслуживания.\n- Обеспечил соблюдение договорных условий [**по X договорам / Y% обслуживающих организаций**], контролируя работу контрагентов.\n\n## Универсальные показатели, которые можно использовать\n\n- количество сотрудников в подчинении;\n- количество автомобилей и водителей;\n- количество заявок или перевозок за месяц;\n- объём и стоимость перевезённых грузов;\n- доля перевозок, выполненных в срок;\n- срок подбора транспорта или расчёта ставки;\n- размер и динамика дебиторской задолженности;\n- число привлечённых перевозчиков и соисполнителей;\n- размер базы перевозчиков;\n- экономия на транспортных расходах;\n- количество маршрутов, клиентов, магазинов или направлений;\n- число договоров, контрактов и процедур на электронных площадках;\n- количество и доля возвратов документов на исправление.\n\n## Пример заполнения\n\nЗаготовка:\n\n> Расширил базу перевозчиков [**на X компаний / X%**], организовав системный поиск и взаимодействие с транспортными компаниями.\n\nС цифрами:\n\n> Расширил базу перевозчиков на 35 компаний за 12 месяцев, организовав системный поиск и проверку новых транспортных компаний.\n\nБез цифр:\n\n> Расширил базу перевозчиков, организовав системный поиск и взаимодействие с транспортными компаниями.\n\nИспользовать пример с цифрами можно только после подтверждения Сергеем фактических значений."}, {"id": "final-data", "group": "work", "title": "Данные для финализации резюме", "editable": true, "content": "# Данные для финализации резюме Сергея Амелехина\n\nПодготовленные версии основаны только на базовом резюме. Чтобы сделать их окончательными и конкурентными для публикации на HeadHunter, необходимо получить следующие сведения.\n\n## Критически важно\n\n1. Город проживания, готовность к переезду и командировкам.\n2. Образование: учебное заведение, специальность, год окончания.\n3. Текущий статус после июля 2025 года.\n4. Желаемый уровень дохода по каждой из четырёх позиций.\n5. Предпочтительный формат работы и график.\n\n## Для усиления управленческих версий\n\n1. Сколько сотрудников было в отделе АО «РЖД Логистика» и сколько человек находилось в прямом подчинении.\n2. За какие показатели и участки работы Сергей отвечал лично.\n3. Какие отчёты готовил и для какого уровня руководства.\n4. Есть ли измеримый результат по снижению дебиторской задолженности.\n5. Какие процессы удалось улучшить, ускорить или упорядочить.\n\n## Для усиления профессиональной экспертизы\n\n1. География перевозок: Россия, СНГ, международные направления.\n2. Основные категории грузов и отрасли клиентов.\n3. Типичные и максимальные объёмы: число заявок, машин или перевозок за месяц.\n4. Примеры наиболее сложных мультимодальных и негабаритных перевозок.\n5. Какие электронные торговые площадки и информационные системы использовал Сергей.\n6. Уровень владения 1С, Excel и другими рабочими программами.\n7. Есть ли собственная действующая база перевозчиков.\n\n## Дополнительные сведения\n\n1. Курсы, удостоверения и профессиональные сертификаты.\n2. Наличие водительского удостоверения и категории.\n3. Знание иностранных языков.\n4. Причины перерывов между местами работы — только если Сергей считает нужным подготовить объяснение для интервью.\n\nПосле получения этих данных в резюме можно будет добавить доказательные достижения, уточнить уровень каждой позиции и убрать основные вопросы, которые могут возникнуть у рекрутера."}, {"id": "xyz-guide", "group": "work", "title": "Как работать с комплектом XYZ", "editable": false, "content": "# Как работать с комплектом резюме XYZ\n\nЭтот комплект отличается от основного тем, что опыт сформулирован через результат, его измеритель и действия Сергея.\n\n## Правило заполнения\n\nФрагменты в квадратных скобках являются необязательными:\n\n- если показатель известен — заменить `X`, `Y` и поясняющий текст фактическими данными;\n- если показатель неизвестен — удалить квадратные скобки вместе с их содержимым;\n- если сам результат нельзя подтвердить — удалить весь пункт;\n- перед публикацией в резюме не должно остаться `X`, `Y`, квадратных скобок или редакторских пояснений.\n\nПример:\n\n> Снизил дебиторскую задолженность [на X% / с X до Y] [за счёт способа работы с задолженностью].\n\nПосле заполнения:\n\n> Снизил дебиторскую задолженность на 18% за год за счёт еженедельной сверки оплат и адресной работы с клиентами.\n\nБез цифр:\n\n> Снизил дебиторскую задолженность.\n\n## Правило отбора\n\nВ итоговой версии следует оставить:\n\n- 3–5 наиболее сильных пунктов для последних двух мест работы;\n- 2–3 пункта для каждого более раннего места;\n- только достижения и масштабы, которые Сергей готов подтвердить на собеседовании.\n\nНе нужно заполнять и публиковать все предложенные варианты одновременно."}];
    const GROUPS = {
      base: "Базовое резюме",
      standard: "Стандартные резюме",
      xyz: "Резюме по формуле XYZ",
      letters: "Сопроводительные письма",
      work: "Заполнение показателей и недостающие данные"
    };
    const STORAGE_PREFIX = "sergey-amelehin-portal-v1:";

    const state = {
      group: "base",
      documentId: "base",
      editMode: false
    };

    const documentElement = document.getElementById("document");
    const selectElement = document.getElementById("document-select");
    const modeLabel = document.getElementById("mode-label");
    const notice = document.getElementById("notice");
    const toast = document.getElementById("toast");
    let toastTimer;

    function currentDocument() {
      return DOCUMENTS.find((item) => item.id === state.documentId) || DOCUMENTS[0];
    }

    function storedContent(doc) {
      if (!doc.editable) return doc.content;
      return localStorage.getItem(STORAGE_PREFIX + doc.id) ?? doc.content;
    }

    function saveContent(doc, content) {
      localStorage.setItem(STORAGE_PREFIX + doc.id, content);
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function inlineMarkdown(value) {
      let html = escapeHtml(value);
      html = html.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      return html;
    }

    function parseTable(lines, start) {
      const rows = [];
      let index = start;
      while (index < lines.length && lines[index].trim().startsWith("|")) {
        rows.push(lines[index].trim());
        index += 1;
      }
      const parsed = rows.map((row) => row.slice(1, -1).split("|").map((cell) => cell.trim()));
      const hasSeparator = parsed.length > 1 && parsed[1].every((cell) => /^:?-{3,}:?$/.test(cell));
      let html = "<table>";
      if (parsed.length) {
        html += "<thead><tr>" + parsed[0].map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join("") + "</tr></thead>";
        const bodyRows = hasSeparator ? parsed.slice(2) : parsed.slice(1);
        html += "<tbody>" + bodyRows.map((row) => "<tr>" + row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`).join("") + "</tr>").join("") + "</tbody>";
      }
      html += "</table>";
      return { html, nextIndex: index };
    }

    function markdownToHtml(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      const output = [];
      let index = 0;
      let listType = null;

      function closeList() {
        if (listType) output.push(`</${listType}>`);
        listType = null;
      }

      while (index < lines.length) {
        const raw = lines[index];
        const line = raw.trimEnd();

        if (line.trim().startsWith("|")) {
          closeList();
          const table = parseTable(lines, index);
          output.push(table.html);
          index = table.nextIndex;
          continue;
        }

        const heading = /^(#{1,3})\s+(.+)$/.exec(line);
        if (heading) {
          closeList();
          const level = heading[1].length;
          output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
          index += 1;
          continue;
        }

        const unordered = /^-\s+(.+)$/.exec(line);
        const ordered = /^\d+\.\s+(.+)$/.exec(line);
        if (unordered || ordered) {
          const type = unordered ? "ul" : "ol";
          if (listType !== type) {
            closeList();
            output.push(`<${type}>`);
            listType = type;
          }
          output.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
          index += 1;
          continue;
        }

        closeList();
        if (!line.trim()) {
          index += 1;
          continue;
        }
        if (line.startsWith("> ")) {
          output.push(`<blockquote>${inlineMarkdown(line.slice(2))}</blockquote>`);
        } else {
          output.push(`<p>${inlineMarkdown(line)}</p>`);
        }
        index += 1;
      }
      closeList();
      return output.join("\n");
    }

    function markdownToPlain(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      return lines.map((line) => {
        if (/^\|\s*:?-{3,}/.test(line)) return "";
        if (line.trim().startsWith("|")) {
          return line.trim().slice(1, -1).split("|").map((cell) => cell.trim().replace(/<br\s*\/?>(\s*)/gi, " / ")).join("\t");
        }
        return line
          .replace(/^#{1,6}\s+/, "")
          .replace(/^>\s?/, "")
          .replace(/\*\*/g, "")
          .replace(/`/g, "")
          .replace(/<br\s*\/?>/gi, "\n");
      }).join("\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function addSectionButtons(container) {
      [...container.querySelectorAll("h2, h3")].forEach((heading) => {
        const wrapper = document.createElement("div");
        wrapper.className = "heading-row";
        heading.parentNode.insertBefore(wrapper, heading);
        wrapper.appendChild(heading);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "copy-section";
        button.textContent = "Копировать раздел";
        button.addEventListener("click", () => copyHeadingSection(wrapper));
        wrapper.appendChild(button);
      });
    }

    function copyHeadingSection(wrapper) {
      const heading = wrapper.querySelector("h2, h3");
      const level = Number(heading.tagName.slice(1));
      const nodes = [heading.cloneNode(true)];
      let current = wrapper.nextElementSibling;
      while (current) {
        const nextHeading = current.matches(".heading-row") ? current.querySelector("h2, h3") : null;
        if (nextHeading && Number(nextHeading.tagName.slice(1)) <= level) break;
        const clone = current.cloneNode(true);
        clone.querySelectorAll?.(".copy-section").forEach((item) => item.remove());
        nodes.push(clone);
        current = current.nextElementSibling;
      }
      const holder = document.createElement("div");
      nodes.forEach((node) => holder.appendChild(node));
      copyText(holder.innerText.trim(), `Раздел «${heading.innerText}» скопирован`);
    }

    async function copyText(text, message = "Текст скопирован") {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          helper.remove();
        }
        showToast(message);
      } catch (error) {
        showToast("Не удалось скопировать автоматически. Выделите текст вручную.");
      }
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function populateSelect() {
      const docs = DOCUMENTS.filter((doc) => doc.group === state.group);
      selectElement.innerHTML = docs.map((doc) => `<option value="${doc.id}">${escapeHtml(doc.title)}</option>`).join("");
      if (!docs.some((doc) => doc.id === state.documentId)) state.documentId = docs[0].id;
      selectElement.value = state.documentId;
    }

    function setToolbar(doc) {
      document.getElementById("edit-document").hidden = !doc.editable || state.editMode;
      document.getElementById("save-document").hidden = !doc.editable || !state.editMode;
      document.getElementById("remove-unfilled").hidden = !doc.editable || !state.editMode;
      document.getElementById("unwrap-brackets").hidden = !doc.editable || !state.editMode;
      document.getElementById("reset-document").hidden = !doc.editable;
      modeLabel.textContent = doc.editable ? (state.editMode ? "Режим редактирования" : "Можно редактировать") : "Только просмотр";
      notice.innerHTML = doc.editable
        ? "Изменения сохраняются только в браузере. Перед использованием удалите незаполненные показатели и убедитесь, что в тексте не осталось <strong>X</strong>, <strong>Y</strong> и редакторских пояснений."
        : "Кнопка «Скопировать документ» переносит обычный текст без HTML и Markdown. Для отдельных полей HeadHunter используйте кнопки «Копировать раздел».";
    }

    function render() {
      populateSelect();
      const doc = currentDocument();
      setToolbar(doc);
      document.querySelectorAll("[data-group]").forEach((button) => button.classList.toggle("active", button.dataset.group === state.group));

      if (state.editMode && doc.editable) {
        documentElement.innerHTML = "";
        const editor = document.createElement("textarea");
        editor.className = "editor";
        editor.id = "active-editor";
        editor.value = storedContent(doc);
        editor.setAttribute("aria-label", `Редактирование: ${doc.title}`);
        editor.addEventListener("input", () => saveContent(doc, editor.value));
        documentElement.appendChild(editor);
      } else {
        documentElement.innerHTML = markdownToHtml(storedContent(doc));
        addSectionButtons(documentElement);
      }
    }

    function activeText() {
      const doc = currentDocument();
      const editor = document.getElementById("active-editor");
      return editor ? editor.value : storedContent(doc);
    }

    function updateEditor(nextText, message) {
      const doc = currentDocument();
      const editor = document.getElementById("active-editor");
      if (!editor || !doc.editable) return;
      editor.value = nextText;
      saveContent(doc, nextText);
      showToast(message);
    }

    function removeUnfilled(text) {
      return text
        .replace(/\[[^\]]*(?:X|Y|подтвержд|способ|уровень руководства|канал|источник)[^\]]*\]/gi, "")
        .replace(/[ \t]+([,.;:])/g, "$1")
        .replace(/[ \t]{2,}/g, " ");
    }

    function unwrapBrackets(text) {
      return text.replace(/\[([^\]]+)\]/g, "$1");
    }

    function download(name, content, type = "text/plain;charset=utf-8") {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      link.click();
      URL.revokeObjectURL(url);
    }

    document.querySelectorAll("[data-group]").forEach((button) => {
      button.addEventListener("click", () => {
        state.group = button.dataset.group;
        state.documentId = DOCUMENTS.find((doc) => doc.group === state.group).id;
        state.editMode = false;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    selectElement.addEventListener("change", () => {
      state.documentId = selectElement.value;
      state.editMode = false;
      render();
    });

    document.getElementById("copy-document").addEventListener("click", () => {
      const doc = currentDocument();
      copyText(markdownToPlain(activeText()), `Документ «${doc.title}» скопирован`);
    });

    document.getElementById("edit-document").addEventListener("click", () => {
      state.editMode = true;
      render();
    });

    document.getElementById("save-document").addEventListener("click", () => {
      const doc = currentDocument();
      const editor = document.getElementById("active-editor");
      if (editor) saveContent(doc, editor.value);
      state.editMode = false;
      render();
      showToast("Изменения сохранены в браузере");
    });

    document.getElementById("remove-unfilled").addEventListener("click", () => {
      updateEditor(removeUnfilled(activeText()), "Незаполненные вставки удалены");
    });

    document.getElementById("unwrap-brackets").addEventListener("click", () => {
      updateEditor(unwrapBrackets(activeText()), "Квадратные скобки сняты");
    });

    document.getElementById("reset-document").addEventListener("click", () => {
      const doc = currentDocument();
      if (!doc.editable) return;
      if (!confirm("Удалить локальные изменения и вернуть исходный текст?")) return;
      localStorage.removeItem(STORAGE_PREFIX + doc.id);
      state.editMode = false;
      render();
      showToast("Исходный текст восстановлен");
    });

    document.getElementById("download-document").addEventListener("click", () => {
      const doc = currentDocument();
      const safeName = doc.title.replace(/[\\/:*?"<>|]/g, "-");
      download(`${safeName}.txt`, markdownToPlain(activeText()));
    });

    document.getElementById("print-document").addEventListener("click", () => window.print());

    document.getElementById("export-all").addEventListener("click", () => {
      const changed = DOCUMENTS.filter((doc) => doc.editable).map((doc) => ({
        id: doc.id,
        title: doc.title,
        content: storedContent(doc),
        changed: localStorage.getItem(STORAGE_PREFIX + doc.id) !== null
      }));
      const payload = {
        exportedAt: new Date().toISOString(),
        person: "Сергей Васильевич Амелехин",
        documents: changed
      };
      download("sergey-amelehin-filled-data.json", JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
    });

    render();
  </script>
</body>
</html>
